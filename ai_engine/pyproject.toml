[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "fog-validation"
version = "0.1.0"
description = "Reproducible validation of public Parkinson's freezing-of-gait datasets (Daphnet, gaitpdb)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
